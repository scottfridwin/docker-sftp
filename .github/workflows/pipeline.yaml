name: Build and Publish Container

on:
  push:
    branches: [ "main" ]
    paths:
      - "src/**"
      - ".github/workflows/**"
  workflow_dispatch:  # allows manual trigger

env:
  # Version pattern: 5.2.<run_number>
  version: 5.2.${{ github.run_number }}
  # Your GHCR image path
  imageRepository: ghcr.io/scottfridwin/sftp

jobs:
  build:
    name: Build and Publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Build and push multi-architecture image
        run: |
          docker buildx build \
            --platform linux/amd64 \
            --push \
            --provenance=false \
            -t ${{ env.imageRepository }}:${{ env.version }} \
            -t ${{ env.imageRepository }}:latest \
            -f src/ES.SFTP/Dockerfile src/

      - name: Display published tags
        run: |
          echo "Published image tags:"
          echo "  ${{ env.imageRepository }}:${{ env.version }}"
          echo "  ${{ env.imageRepository }}:latest"
